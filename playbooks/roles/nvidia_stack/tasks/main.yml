---
# Bootstrap the NVIDIA GPG keyrings before writing the .sources files below.
#
# The .sources files reference /usr/share/keyrings/dgx_debian_prod.gpg and
# cuda_debian_prod.gpg, which ship inside dgx-repo-files.tgz and are owned by
# the nvidia-repo-keys package. They are NOT installed by this role or base,
# and doca_ofed only installs nvidia-repo-keys when a ConnectX-7 NIC is present
# (and it runs after this role). Extract just the keyrings + apt preferences
# from the tarball now so a fresh host has the Signed-By files before the first
# apt update. The broken sources files inside the tarball are intentionally not
# extracted - we write the corrected versions below.
- name: Bootstrap NVIDIA repo keyrings from dgx-repo-files.tgz
  ansible.builtin.command: >
    curl -fsSL https://repo.download.nvidia.com/baseos/ubuntu/noble/arm64/dgx-repo-files.tgz
    | tar xzf - -C / ./usr/share/keyrings ./etc/apt/preferences.d
  args:
    creates: /usr/share/keyrings/dgx_debian_prod.gpg
  changed_when: false

# The dgx-repo-files.tgz sources entry points at the broken `baseos/8` URL.
# Write the working .sources files directly instead, matching what the GX10s run
# in production. This matches the split layout and avoids the broken tgz path.
- name: Fix NVIDIA DGX repo source to the working guide URL
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/dgx.sources
    content: |
      # NVIDIA DGX base OS repo. Uses the non-8 path which is the live repo
      # (the baseos/8 path ships in dgx-repo-files.tgz but 404s).
      # Components: common provides nvidia-system-*/nvidia-peermem-loader,
      # dgx provides the remainder.
      Types: deb
      URIs: https://repo.download.nvidia.com/baseos/ubuntu/noble/arm64/
      Suites: noble noble-updates
      Components: common dgx
      Signed-By: /usr/share/keyrings/dgx_debian_prod.gpg
    owner: root
    group: root
    mode: '0644'

- name: Ensure CUDA compute repo source present (sbsa / arm64)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/cuda-compute-repo.sources
    content: |
      # NVIDIA CUDA compute repo (sbsa = ARM64 / GB10).
      Types: deb
      URIs: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/
      Suites: /
      Signed-By: /usr/share/keyrings/cuda_debian_prod.gpg
    owner: root
    group: root
    mode: '0644'

- name: Ensure NVIDIA HWE kernel pinned to 6.x (block 7.x)
  # The linux-image-nvidia-hwe-24.04 metapackage now tracks 7.x in the archive.
  # Pin the 6.x line (validated on the GX10s) so a fresh host stays on it, and
  # block 7.x until it is validated for the GB10 stack.
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/gb10-kernel.pref
    content: |
      # Keep the GB10 on the validated 6.x NVIDIA HWE kernel line.
      Package: linux-nvidia-hwe-24.04 linux-image-nvidia-hwe-24.04 linux-headers-nvidia-hwe-24.04 linux-tools-nvidia-hwe-24.04
      Pin: version 6.*
      Pin-Priority: 1001

      Package: linux-nvidia-hwe-24.04 linux-image-nvidia-hwe-24.04 linux-headers-nvidia-hwe-24.04 linux-tools-nvidia-hwe-24.04
      Pin: version 7.*
      Pin-Priority: -1
    owner: root
    group: root
    mode: '0644'

- name: Update apt cache after repo setup
  ansible.builtin.apt:
    update_cache: yes

- name: Resolve the latest available NVIDIA HWE kernel on the pinned 6.x line
  # Because the linux-image-nvidia-hwe-24.04 metapackage tracks 7.x and the pin
  # blocks 7.x, a fresh host cannot get 6.x from the metapackage. Query apt for
  # the highest available linux-image-<6>.*-nvidia instead and install the
  # specific versioned packages so a fresh host lands on the validated line.
  ansible.builtin.command: >
    bash -c 'apt-cache pkgnames | grep -E "^linux-image-[0-9].*-nvidia$"
    | while read p; do v=$(apt-cache policy "$p" | awk "/^  Candidate:/{print \$2; exit}");
    [ -n "$v" ] && [ "${v#6.}" != "$v" ] && echo "$p $v"; done | sort -V | tail -1 | awk "{print \$1}"'
  register: nvidia_stack_kernel_pkg_out
  changed_when: false
  check_mode: false

- name: Set the resolved NVIDIA HWE kernel version
  ansible.builtin.set_fact:
    nvidia_stack_kernel_ver: "{{ nvidia_stack_kernel_pkg_out.stdout | regex_replace('^linux-image-', '') | regex_replace('-nvidia$', '') }}"
  when: nvidia_stack_kernel_pkg_out.stdout | length > 0

- name: Install NVIDIA HWE kernel (resolved 6.x)
  ansible.builtin.apt:
    name:
      - "linux-image-{{ nvidia_stack_kernel_ver | default('6.17.0-1032') }}-nvidia"
      - "linux-headers-{{ nvidia_stack_kernel_ver | default('6.17.0-1032') }}-nvidia"
      - "linux-modules-{{ nvidia_stack_kernel_ver | default('6.17.0-1032') }}-nvidia"
      - "linux-modules-nvidia-fs-{{ nvidia_stack_kernel_ver | default('6.17.0-1032') }}-nvidia"
    state: present
  register: hwe_kernel_install

- name: Install NVIDIA HWE tools + peermem loader
  ansible.builtin.apt:
    name:
      - "linux-tools-{{ nvidia_stack_kernel_ver | default('6.17.0-1032') }}-nvidia"
      - nvidia-peermem-loader
    state: present

- name: Install NVIDIA system metapackages
  ansible.builtin.apt:
    name:
      - nvidia-system-core
      - nvidia-system-utils
      - nvidia-system-extra
    state: present

- name: Reboot to load HWE kernel
  ansible.builtin.reboot:
    reboot_timeout: 300
    post_reboot_delay: 30
    msg: "Rebooting to load HWE kernel"
  when: hwe_kernel_install.changed

- name: Install NVIDIA driver pinning package
  ansible.builtin.apt:
    name: "nvidia-driver-pinning-{{ nvidia_driver_version }}"
    state: present

- name: Install NVIDIA driver and DCGM packages
  ansible.builtin.apt:
    name:
      - "nvidia-driver-{{ nvidia_driver_version }}-open"
      - libnvidia-nscq
      - nvidia-modprobe
      - datacenter-gpu-manager-4-cuda13
      - nv-persistence-mode
    state: present
    allow_downgrade: yes

- name: Check if NVIDIA kernel module is loaded
  ansible.builtin.command: lsmod
  register: lsmod_out
  changed_when: false

- name: Reboot to load NVIDIA kernel modules
  ansible.builtin.reboot:
    reboot_timeout: 300
    post_reboot_delay: 30
    msg: "Rebooting to load NVIDIA kernel modules"
  when: "'nvidia' not in lsmod_out.stdout"

- name: Enable NVIDIA persistence daemon and DCGM (starts after MOK enrollment + reboot)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
  loop:
    - nvidia-persistenced
    - nvidia-dcgm

- name: Install CUDA toolkit
  ansible.builtin.apt:
    name: "cuda-toolkit-{{ cuda_version }}"
    state: present

- name: Configure CUDA PATH for all users
  ansible.builtin.copy:
    dest: /etc/profile.d/cuda.sh
    content: |
      export PATH=/usr/local/cuda/bin:$PATH
      export LD_LIBRARY_PATH=/usr/local/cuda/lib64:${LD_LIBRARY_PATH}
    owner: root
    group: root
    mode: '0644'

- name: Purge nvsm (crash-loops on non-DGX systems)
  ansible.builtin.apt:
    name: nvsm
    state: absent
    purge: yes
  ignore_errors: yes

- name: Remove nvsm orphaned dependencies
  ansible.builtin.apt:
    autoremove: yes

- name: Reset failed systemd units after nvsm removal
  ansible.builtin.command: systemctl reset-failed
  changed_when: false

- name: Install CX-7 / RDMA userspace tools
  ansible.builtin.apt:
    name:
      - mlnx-tools
      - infiniband-diags
    state: present

- name: Install NCCL runtime
  ansible.builtin.apt:
    name:
      - libnccl2
    state: present

- name: Pin nvidia-modprobe to driver version (prevent version mismatch crashes)
  ansible.builtin.apt:
    name: "nvidia-modprobe={{ nvidia_package_version }}"
    state: present
    allow_downgrade: yes

# nvidia-container-toolkit 1.19+ defaults to mode = "auto", which activates
# CDI mode when CDI device specs are present (/etc/cdi). CDI mode does NOT
# run the legacy hook that populates /opt/nvidia/nvidia_entrypoint.sh, so
# CUDA images fail at container start with "exec format error" (ENOEXEC).
# Force legacy mode so the hook runs and the entrypoint is populated correctly.
- name: Set nvidia-container-runtime mode to legacy
  ansible.builtin.lineinfile:
    path: /etc/nvidia-container-runtime/config.toml
    regexp: '^mode\s*='
    line: 'mode = "legacy"'
  notify: restart docker

- name: Verify GPU access in container
  ansible.builtin.command: >
    docker run --rm --gpus all --entrypoint nvidia-smi
    nvidia/cuda:{{ cuda_base_image_tag }}-devel-ubuntu24.04
  changed_when: false
  register: nct_verify

- name: Assert nvidia-smi succeeded in container
  ansible.builtin.assert:
    that: nct_verify.rc == 0
    fail_msg: "GPU not accessible in container after setting legacy mode"
